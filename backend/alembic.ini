# A generic, single database configuration.

[alembic]
# path to migration scripts.
# Use forward slashes (/) also on windows to provide an OS agnostic path
script_location = alembic

# sys.path prepend, to allow alembic env.py to import the project
prepend_sys_path = .

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# file_template = %%(rev)s_%%(slug)s

# The URL is loaded from the environment / app config in env.py.
# This placeholder is only used when running alembic commands directly
# without the app config. Override via VISIONDNA_DATABASE_URL env var.
sqlalchemy.url = postgresql+asyncpg://visiondna:visiondna@localhost:5432/visiondna

[post_write_hooks]
# Uncomment to run black on generated migration files
# hooks = black
# black.type = console_scripts
# black.entrypoint = black

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
