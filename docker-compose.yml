services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-visiondna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visiondna_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-visiondna}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-visiondna} -d ${POSTGRES_DB:-visiondna}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-visiondna}:${POSTGRES_PASSWORD:-visiondna_secure_pass}@postgres:5432/${POSTGRES_DB:-visiondna}
    volumes:
      - ./models:/app/models
      - ./data/videos:/app/data/videos
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
